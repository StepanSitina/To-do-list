<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-do list</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1d2733;
      background: #f4f7fb;
      --page-bg: #f4f7fb;
      --surface: #fff;
      --heading: #18212d;
      --body-text: #263445;
      --muted: #667085;
      --border: #e6eaf0;
      --input-border: #dfe4ec;
      --accent-soft: #e8e7ff;
      --accent-text: #4f46b8;
      --shadow: rgb(35 45 70 / 6%);
      --empty-border: #d6dce7;
    }

    :root[data-theme="dark"] {
      color: #edf2f7;
      background: #111827;
      --page-bg: #111827;
      --surface: #1d2939;
      --heading: #f8fafc;
      --body-text: #e5e7eb;
      --muted: #aab4c3;
      --border: #344054;
      --input-border: #475467;
      --accent-soft: #312e72;
      --accent-text: #c7c4ff;
      --shadow: rgb(0 0 0 / 20%);
      --empty-border: #475467;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page-bg);
      transition: background-color 220ms ease, color 220ms ease;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app-shell {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 48px 0;
    }

    .dashboard {
      position: relative;
      margin-bottom: 28px;
    }

    .brand-logo {
      display: block;
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
      border-radius: 18px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #6b63d9;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--heading);
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .dashboard-copy {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .counter {
      display: inline-flex;
      margin-top: 20px;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-text);
      font-weight: 800;
    }

    .task-form {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
    }

    .task-input {
      min-width: 0;
      flex: 1;
      border: 1px solid var(--input-border);
      border-radius: 14px;
      padding: 15px 17px;
      outline: none;
      background: var(--surface);
      color: var(--body-text);
      box-shadow: 0 8px 26px var(--shadow);
      transition: background-color 220ms ease, border-color 220ms ease, color 220ms ease, box-shadow 220ms ease;
    }

    .task-input:focus {
      border-color: #7269df;
      box-shadow: 0 0 0 4px rgb(114 105 223 / 15%);
    }

    .add-button {
      border-radius: 14px;
      padding: 0 22px;
      background: #5b52c6;
      color: #fff;
      font-weight: 800;
      transition: transform 160ms ease, background 160ms ease;
    }

    .add-button:hover {
      background: #4840ac;
      transform: translateY(-2px);
    }

    .task-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 66px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 8px 26px var(--shadow);
      transition: background-color 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
    }

    .task-checkbox {
      width: 21px;
      height: 21px;
      flex: 0 0 auto;
      accent-color: #5b52c6;
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      overflow-wrap: anywhere;
      color: var(--body-text);
      font-weight: 600;
      line-height: 1.45;
    }

    .task-item.completed .task-text {
      color: var(--muted);
      text-decoration: line-through;
    }

    .delete-button {
      flex: 0 0 auto;
      padding: 8px;
      border-radius: 9px;
      background: transparent;
      color: #98a2b3;
      font-size: 1.15rem;
      line-height: 1;
      transition: background 160ms ease, color 160ms ease;
    }

    .delete-button:hover {
      background: #fff0f0;
      color: #d04444;
    }

    .empty-state {
      padding: 34px 20px;
      border: 1px dashed var(--empty-border);
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
    }

    .theme-toggle {
      position: absolute;
      top: 0;
      right: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      background: var(--surface);
      color: var(--body-text);
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: 0 5px 16px var(--shadow);
      transition: background-color 220ms ease, border-color 220ms ease, color 220ms ease, transform 160ms ease;
    }

    .theme-toggle:hover {
      transform: translateY(-2px);
    }

    .celebration {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgb(37 25 89 / 88%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .celebration.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .celebration-card {
      width: min(100%, 560px);
      padding: clamp(32px, 8vw, 64px) clamp(24px, 7vw, 58px);
      border: 1px solid rgb(255 255 255 / 55%);
      border-radius: 28px;
      background: linear-gradient(140deg, #ffdb70 0%, #ff8f70 48%, #ec5bd2 100%);
      color: #3a195f;
      text-align: center;
      box-shadow: 0 25px 90px rgb(22 9 70 / 45%);
      transform: translateY(18px) scale(0.97);
      transition: transform 260ms ease;
    }

    .celebration.visible .celebration-card {
      transform: translateY(0) scale(1);
    }

    .celebration-icon {
      display: block;
      margin-bottom: 12px;
      font-size: 3.5rem;
    }

    .celebration h2 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.4rem);
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .celebration-quote {
      margin: 20px auto 28px;
      max-width: 430px;
      color: #542a6e;
      font-size: 1.08rem;
      font-weight: 600;
      line-height: 1.6;
    }

    .continue-button {
      border-radius: 999px;
      padding: 13px 28px;
      background: #3a195f;
      color: #fff;
      font-weight: 800;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .continue-button:hover {
      box-shadow: 0 8px 20px rgb(58 25 95 / 25%);
      transform: translateY(-2px);
    }

    @media (max-width: 520px) {
      .app-shell {
        padding: 30px 0;
      }

      .task-form {
        align-items: stretch;
        flex-direction: column;
      }

      .add-button {
        min-height: 50px;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="dashboard">
      <img class="brand-logo" src="assets/logo.png" alt="To-do list logo">
      <p class="eyebrow">Daily momentum</p>
      <h1>To-do list</h1>
      <p class="dashboard-copy">Small steps, steady progress, one clear list.</p>
      <div class="counter" id="completed-counter">Completed: 0</div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode">
        <span id="theme-icon" aria-hidden="true">☾</span>
        <span id="theme-label">Dark mode</span>
      </button>
    </header>

    <form class="task-form" id="task-form">
      <input class="task-input" id="task-input" type="text" placeholder="What needs to get done?" aria-label="New task" autocomplete="off">
      <button class="add-button" type="submit">Add Task</button>
    </form>

    <ul class="task-list" id="task-list"></ul>
  </main>

  <section class="celebration" id="celebration" role="dialog" aria-modal="true" aria-labelledby="celebration-title" aria-hidden="true">
    <div class="celebration-card">
      <span class="celebration-icon" aria-hidden="true">✨</span>
      <h2 id="celebration-title">You did it!</h2>
      <p class="celebration-quote" id="celebration-quote"></p>
      <button class="continue-button" id="continue-button" type="button">Continue</button>
    </div>
  </section>

  <script>
    const taskForm = document.querySelector("#task-form");
    const taskInput = document.querySelector("#task-input");
    const taskList = document.querySelector("#task-list");
    const completedCounter = document.querySelector("#completed-counter");
    const celebration = document.querySelector("#celebration");
    const celebrationQuote = document.querySelector("#celebration-quote");
    const continueButton = document.querySelector("#continue-button");
    const themeToggle = document.querySelector("#theme-toggle");
    const themeIcon = document.querySelector("#theme-icon");
    const themeLabel = document.querySelector("#theme-label");

    let tasks = [];
    let previousQuote = "";
    const tasksStorageKey = "focus-list-tasks";
    const themeStorageKey = "focus-list-theme";

    const motivationalQuotes = [
      "The secret of getting ahead is getting started.",
      "Great things are done by a series of small things brought together.",
      "You do not have to be perfect to make progress.",
      "Success is the sum of small efforts, repeated day in and day out.",
      "It always seems impossible until it is done.",
      "Start where you are. Use what you have. Do what you can.",
      "Action is the foundational key to all success.",
      "The future depends on what you do today.",
      "Believe you can and you're halfway there.",
      "Focus on being productive instead of busy.",
      "A little progress each day adds up to big results.",
      "Well begun is half done.",
      "Your only limit is your mind.",
      "Dream big. Start small. Act now.",
      "The best way out is always through.",
      "Do something today that your future self will thank you for.",
      "Discipline is choosing between what you want now and what you want most."
    ];

    function saveTasks() {
      try {
        localStorage.setItem(tasksStorageKey, JSON.stringify(tasks));
      } catch (error) {
        console.error("Unable to save tasks to localStorage.", error);
      }
    }

    function loadTasks() {
      try {
        const savedTasks = localStorage.getItem(tasksStorageKey);
        if (!savedTasks) {
          return;
        }

        const parsedTasks = JSON.parse(savedTasks);
        if (!Array.isArray(parsedTasks) || parsedTasks.some((task) => (
          typeof task.id !== "string"
          || typeof task.text !== "string"
          || typeof task.completed !== "boolean"
        ))) {
          throw new Error("Saved task data has an invalid format.");
        }
        tasks = parsedTasks;
      } catch (error) {
        console.error("Unable to load tasks from localStorage.", error);
        tasks = [];
      }
    }

    function applyTheme(theme) {
      const isDark = theme === "dark";
      document.documentElement.dataset.theme = isDark ? "dark" : "light";
      themeIcon.textContent = isDark ? "☀" : "☾";
      themeLabel.textContent = isDark ? "Light mode" : "Dark mode";
      themeToggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
    }

    function loadTheme() {
      try {
        applyTheme(localStorage.getItem(themeStorageKey) === "dark" ? "dark" : "light");
      } catch (error) {
        console.error("Unable to load theme from localStorage.", error);
        applyTheme("light");
      }
    }

    function toggleTheme() {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      applyTheme(nextTheme);
      try {
        localStorage.setItem(themeStorageKey, nextTheme);
      } catch (error) {
        console.error("Unable to save theme to localStorage.", error);
      }
    }

    function showCelebration() {
      const availableQuotes = motivationalQuotes.filter((quote) => quote !== previousQuote);
      const quote = availableQuotes[Math.floor(Math.random() * availableQuotes.length)];
      previousQuote = quote;
      celebrationQuote.textContent = `"${quote}"`;
      celebration.classList.add("visible");
      celebration.setAttribute("aria-hidden", "false");
      continueButton.focus();
    }

    function hideCelebration() {
      celebration.classList.remove("visible");
      celebration.setAttribute("aria-hidden", "true");
      taskInput.focus();
    }

    function updateCounter() {
      const completedTasks = tasks.filter((task) => task.completed).length;
      completedCounter.textContent = `Completed: ${completedTasks}`;
    }

    function renderTasks() {
      taskList.innerHTML = "";

      if (tasks.length === 0) {
        taskList.innerHTML = '<li class="empty-state">Your list is clear. Add your first task above.</li>';
        updateCounter();
        return;
      }

      tasks.forEach((task) => {
        const taskItem = document.createElement("li");
        taskItem.className = `task-item${task.completed ? " completed" : ""}`;
        taskItem.dataset.taskId = task.id;

        const checkbox = document.createElement("input");
        checkbox.className = "task-checkbox";
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", `Mark "${task.text}" as complete`);
        checkbox.addEventListener("change", () => toggleTask(task.id));

        const taskText = document.createElement("span");
        taskText.className = "task-text";
        taskText.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.setAttribute("aria-label", `Delete "${task.text}"`);
        deleteButton.textContent = "×";
        deleteButton.addEventListener("click", () => deleteTask(task.id));

        taskItem.append(checkbox, taskText, deleteButton);
        taskList.append(taskItem);
      });

      updateCounter();
    }

    function addTask(text) {
      tasks.unshift({
        id: crypto.randomUUID(),
        text,
        completed: false
      });
      saveTasks();
      renderTasks();
    }

    function toggleTask(taskId) {
      const task = tasks.find((item) => item.id === taskId);
      if (!task) {
        return;
      }

      task.completed = !task.completed;
      saveTasks();
      renderTasks();
      if (task.completed) {
        showCelebration();
      }
    }

    function deleteTask(taskId) {
      tasks = tasks.filter((task) => task.id !== taskId);
      saveTasks();
      renderTasks();
    }

    taskForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = taskInput.value.trim();
      if (!text) {
        taskInput.focus();
        return;
      }

      addTask(text);
      taskInput.value = "";
      taskInput.focus();
    });

    continueButton.addEventListener("click", hideCelebration);
    themeToggle.addEventListener("click", toggleTheme);
    celebration.addEventListener("click", (event) => {
      if (event.target === celebration) {
        hideCelebration();
      }
    });

    loadTasks();
    loadTheme();
    renderTasks();
  </script>
</body>
</html>
